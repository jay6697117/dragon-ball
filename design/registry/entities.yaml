# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /architecture-review (data structure and interface validation)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="referenced_by.*inventory"
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised

version: 1
last_updated: "2026-05-12"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: combat_tick_duration_seconds
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/input-buffering.md
      - design/gdd/health-damage-round-rules.md
      - design/gdd/debug-tuning-display.md
    variables:
      - combat_ticks_per_second
    output_range: [0.008333, 0.033334]
    expression: "1 / combat_ticks_per_second"
    notes: "Output range reflects MVP safe tick-rate range 30-120 ticks/sec."
    added: 2026-05-11
    revised: ""
  - name: seconds_to_combat_ticks
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/input-buffering.md
      - design/gdd/character-move-data.md
      - design/gdd/animation-frame-metadata.md
      - design/gdd/hitstop-stun-windows.md
      - design/gdd/debug-tuning-display.md
    variables:
      - duration_seconds
      - combat_ticks_per_second
    output_range: [0, "unbounded"]
    expression: "max(0, ceil(duration_seconds * combat_ticks_per_second))"
    notes: "Positive second-based durations convert upward so gameplay windows are not shortened; negative durations clamp to 0."
    added: 2026-05-11
    revised: ""
  - name: next_committed_tick_index
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/input-buffering.md
      - design/gdd/round-flow-restart.md
      - design/gdd/combat-hud-feedback.md
      - design/gdd/debug-tuning-display.md
    variables:
      - current_committed_tick_index
    output_range: [1, "unbounded"]
    expression: "current_committed_tick_index + 1"
    notes: "Tick 0 is the initial snapshot; first gameplay tick is 1."
    added: 2026-05-11
    revised: ""
  - name: elapsed_running_ticks
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/health-damage-round-rules.md
      - design/gdd/combat-hud-feedback.md
      - design/gdd/debug-tuning-display.md
    variables:
      - running_tick_flag_i
      - committed_tick_count
    output_range: [0, "committed_tick_count"]
    expression: "sum(running_tick_flag_i for i = 1 to committed_tick_count)"
    notes: "Counts running ticks only; hitstop ticks increment committed_tick_index but do not increment elapsed running time."
    added: 2026-05-11
    revised: ""
  - name: elapsed_running_time_seconds
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/health-damage-round-rules.md
      - design/gdd/combat-hud-feedback.md
      - design/gdd/debug-tuning-display.md
    variables:
      - elapsed_running_ticks
      - combat_ticks_per_second
    output_range: [0, "unbounded"]
    expression: "elapsed_running_ticks / combat_ticks_per_second"
    notes: "Active round time only; excludes hitstop, pause, focus suspension, countdown, inactive, and round-ended states."
    added: 2026-05-11
    revised: ""
  - name: round_timer_remaining_ticks
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/health-damage-round-rules.md
      - design/gdd/round-flow-restart.md
      - design/gdd/combat-hud-feedback.md
      - design/gdd/debug-tuning-display.md
    variables:
      - round_duration_ticks
      - elapsed_running_ticks
    output_range: [0, "round_duration_ticks"]
    expression: "max(0, round_duration_ticks - elapsed_running_ticks)"
    notes: "Round timer decreases only during running ticks, not during hitstop or paused/focus states."
    added: 2026-05-11
    revised: ""
  - name: hitstop_remaining_ticks_after_tick
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/hitstop-stun-windows.md
      - design/gdd/input-buffering.md
      - design/gdd/debug-tuning-display.md
    variables:
      - hitstop_remaining_ticks_before_tick
      - hitstop_tick_flag
    output_range: [0, "hitstop_remaining_ticks_before_tick"]
    expression: "max(0, hitstop_remaining_ticks_before_tick - hitstop_tick_flag)"
    notes: "Hitstop ticks increment committed_tick_index but do not decrease hitstun, blockstun, recovery, projectiles, or round timer."
    added: 2026-05-11
    revised: ""
  - name: backlog_tick_count
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/web-platform-shell.md
      - design/gdd/pause-basic-menu.md
      - design/gdd/debug-tuning-display.md
    variables:
      - delayed_real_seconds
      - combat_tick_duration_seconds
    output_range: [0, "unbounded"]
    expression: "max(0, floor(max(0, delayed_real_seconds) / combat_tick_duration_seconds))"
    notes: "Negative platform/clock delay is clamped to 0 before backlog classification."
    added: 2026-05-11
    revised: ""
  - name: runtime_event_sequence_key
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/combat-hud-feedback.md
      - design/gdd/readable-combat-vfx.md
      - design/gdd/combat-audio-feedback.md
      - design/gdd/debug-tuning-display.md
      - design/gdd/round-flow-restart.md
    variables:
      - round_instance_sequence
      - committed_tick_index
      - phase_order_namespace_ordinal
      - tick_phase_order
      - within_phase_event_index
    output_range: ["ordered tuple", "ordered tuple"]
    expression: "(round_instance_sequence, committed_tick_index, phase_order_namespace_ordinal, tick_phase_order, within_phase_event_index)"
    notes: "Revised to use explicit namespace ordinals so running, hitstop, and debug/runtime records do not share ambiguous phase order."
    added: 2026-05-11
    revised: 2026-05-11
  - name: runtime_state_sequence_key
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/web-platform-shell.md
      - design/gdd/pause-basic-menu.md
      - design/gdd/round-flow-restart.md
      - design/gdd/combat-hud-feedback.md
      - design/gdd/debug-tuning-display.md
    variables:
      - round_instance_sequence
      - state_transition_index
    output_range: ["ordered tuple", "ordered tuple"]
    expression: "(round_instance_sequence, state_transition_index)"
    notes: "Orders non-combat runtime state transitions such as pause, focus suspension, recovery pause, resume, restart, countdown, and round end."
    added: 2026-05-11
    revised: ""
  - name: trace_window_bounds
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/debug-tuning-display.md
    variables:
      - latest_committed_tick_index
      - trace_window_ticks
    output_range: [0, "latest_committed_tick_index"]
    expression: "[max(0, latest_committed_tick_index - trace_window_ticks + 1), latest_committed_tick_index]"
    notes: "Defines QA/debug trace retention, not formal player replay."
    added: 2026-05-11
    revised: ""
  - name: backlog_classification
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/web-platform-shell.md
      - design/gdd/pause-basic-menu.md
      - design/gdd/debug-tuning-display.md
    variables:
      - focus_lost
      - backlog_tick_count
      - catch_up_max_ticks
    output_range: ["focus_suspended", "none", "in_order_catch_up", "recovery_pause"]
    expression: "focus_suspended if focus_lost else none/in_order_catch_up/recovery_pause by backlog_tick_count and catch_up_max_ticks"
    notes: "Focus loss wins over backlog catch-up; recovery_pause is a pause reason, not a runtime state."
    added: 2026-05-11
    revised: ""
  - name: catch_up_wall_clock_guard_exceeded
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/web-platform-shell.md
      - design/gdd/pause-basic-menu.md
      - design/gdd/debug-tuning-display.md
    variables:
      - measured_catch_up_wall_clock_ms
      - catch_up_wall_clock_budget_ms
    output_range: [false, true]
    expression: "measured_catch_up_wall_clock_ms >= catch_up_wall_clock_budget_ms"
    notes: "Stops silent catch-up at a safe tick boundary before runtime work consumes too much of the Web frame budget."
    added: 2026-05-11
    revised: ""
  - name: catch_up_stop_reason
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/web-platform-shell.md
      - design/gdd/pause-basic-menu.md
      - design/gdd/combat-hud-feedback.md
      - design/gdd/debug-tuning-display.md
    variables:
      - catch_up_attempted
      - focus_lost
      - backlog_tick_count
      - catch_up_max_ticks
      - blocking_state_reached
      - catch_up_wall_clock_guard_exceeded
      - fairness_stop_required
      - presentation_ack_required
      - remaining_backlog_ticks
    output_range: ["none", "completed_backlog", "wall_clock_guard", "presentation_ack_guard", "blocking_state", "fairness_guard", "focus_suspended", "invalid_backlog"]
    expression: "focus_suspended > invalid_backlog > none(if not attempted) > fairness_guard > blocking_state > presentation_ack_guard > completed_backlog > wall_clock_guard(if backlog remains)"
    notes: "Deterministic precedence for explaining why catch-up completed, stopped before a hidden result, waited for display-watermark ack, or entered recovery_pause. Revised from the earlier ordering so completed_backlog cannot lose to wall_clock_guard after backlog is already clear."
    added: 2026-05-11
    revised: 2026-05-11
  - name: presented_running_tick_index
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/simple-scripted-cpu.md
      - design/gdd/training-dummy.md
      - design/gdd/combat-hud-feedback.md
      - design/gdd/debug-tuning-display.md
    variables:
      - presented_running_tick_index_current
      - next_unpresented_running_tick_index
      - running_presentation_advance_policy
      - running_presentation_advance_result
    output_range: [0, "unbounded"]
    expression: "advance by 1 only when the next sequential running tick has a valid policy/result pair: auto_advance plus auto_advanced, or display_watermark_required plus acknowledged/visually_degraded; otherwise hold current value"
    notes: "Defines the player-visible running-time watermark used by CPU/dummy fairness, catch-up visibility, HUD/debug display, and decision_age_ticks. It is monotonic, advances only in running-tick order from the committed-to-presented-running map, normal ticks auto-advance only after primary snapshot consumer reaches a host-frame boundary, and stale or mismatched ack responses never advance the watermark."
    added: 2026-05-11
    revised: 2026-05-12
  - name: decision_age_ticks
    status: active
    source: design/gdd/fixed-logic-runtime.md
    referenced_by:
      - design/gdd/fixed-logic-runtime.md
      - design/gdd/simple-scripted-cpu.md
      - design/gdd/training-dummy.md
      - design/gdd/debug-tuning-display.md
    variables:
      - target_presented_running_tick_index
      - based_on_presented_running_tick_index
      - min_ai_decision_age_ticks
      - decision_age_ticks_raw
    output_range: ["negative before validation", "unbounded"]
    expression: "decision_age_ticks_raw = target_presented_running_tick_index - based_on_presented_running_tick_index; accepted decision_age_ticks exists only when raw >= min_ai_decision_age_ticks"
    notes: "Simple CPU and fair-reactive dummy commands must satisfy decision_age_ticks >= min_ai_decision_age_ticks using only player-presented running ticks; negative raw values are invalid and rejected as future_observation or invalid_presented_tick_mapping. The 6-tick runtime value is a technical floor, not a first-round/simple CPU gameplay default; downstream CPU tuning must use at least 12 presented running ticks for first-round/simple profiles. Passive, scheduled-script, and QA fixture dummy modes use separate validation rules defined in fixed-logic-runtime."
    added: 2026-05-11
    revised: 2026-05-12

